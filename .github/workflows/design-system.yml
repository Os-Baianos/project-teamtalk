name: CI front-end

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - DEV/**
      - UI-UX/**
      - .github/workflows/design-system.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-front-end-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DEV/front-end
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores de mentira só para o build compilar; o app de verdade usa as variáveis do Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-de-teste-ci
    steps:
      - uses: actions/checkout@v4
      - name: Verifica se o app existe
        id: app
        working-directory: .
        run: |
          if [ -f DEV/front-end/package.json ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.existe == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DEV/front-end/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.app.outputs.existe == 'true'
      - run: npm run build
        if: steps.app.outputs.existe == 'true'
