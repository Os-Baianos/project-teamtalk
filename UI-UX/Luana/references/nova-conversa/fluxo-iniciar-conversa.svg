<text x="1390" y="880" class="h3">Regras do fluxo</text><text x="1390" y="910" class="small muted">1. “Nova conversa” abre a</text><text x="1390" y="928" class="small muted">seleção de contatos.</text><text x="1390" y="958" class="small muted">2. Busca por nome ou @.</text><text x="1390" y="988" class="small muted">3. Selecionar contato abre</text><text x="1390" y="1006" class="small muted">chat sem enviar mensagem.</text><text x="1390" y="1036" class="small muted">4. Estado vazio mantém</text><text x="1390" y="1054" class="small muted">compositor disponível.</text><text x="1390" y="1084" class="small muted">5. Voltar preserva o rascunho.</text><rect x="1390" y="1130" width="300" height="96" rx="10" fill="#fff" stroke="#d5dbdb"/><text x="1408" y="1156" class="small" font-weight="700">Acessibilidade</text><text x="1408" y="1178" class="tiny muted">Foco visível • AA • toque ≥ 44 px</text><text x="1408" y="1196" class="tiny muted">Português-BR • movimento reduzido</text><text x="1408" y="1214" class="tiny muted">Não depender apenas de cor.</text>
<text x="64" y="1292" class="tiny muted">Prancha de proposta • nomes e avatares ilustrativos • sem alteração de tokens ou ícones compartilhados.</text>
